[package]
name = "course-kafka-appendix"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
rdkafka = { version = "=0.38.0", features = ["cmake-build"] }
event-svc = { path = "../../crates/event-svc" }
shared-kernel = { path = "../../crates/shared-kernel" }
tokio = { version = "=1.47.1", features = ["full"] }
sqlx = { version = "=0.8.6", features = ["runtime-tokio","tls-rustls","postgres"] }
serde_json = "=1.0.145"
anyhow = "=1.0.100"